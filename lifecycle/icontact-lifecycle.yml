retired_surfaces:
  note: >-
    Three additional iContact API surfaces were published historically via
    first-party GitHub libraries. Two of their hosts no longer answer. Recorded
    here rather than as apis.yml entries, because an entry pointing at a dead
    host would assert a surface that no longer exists.
  items:
    - name: iContact Pro API
      base_url: https://api.icpro.co/icp
      source: https://github.com/icontact/icontact-pro-api-php
      probed: '2026-08-13'
      state: dead
      evidence: 'api.icpro.co has no DNS A record (NXDOMAIN via 8.8.8.8).'
    - name: iContact Pro Select / OutMarket API
      base_url: https://api.omkt.co/icp
      source: https://github.com/icontact/icontact-pro-select-api-php
      probed: '2026-08-13'
      state: unreachable
      evidence: >-
        api.omkt.co resolves and completes a TLS handshake with a valid
        *.omkt.co certificate, but the HTTP/2 request never returns (curl exit
        code 000 at a 40s timeout).
    - name: iContact API sandbox
      base_url: https://app.sandbox.icontact.com/icp
      source: >-
        Default ICONTACT_APISANDBOXURL constant in
        https://github.com/icontact/icontact-api-php
      probed: '2026-08-13'
      state: broken
      evidence: >-
        Host resolves to an AWS ELB but presents a *.icontact.com certificate
        whose SAN does not cover app.sandbox.icontact.com, so TLS verification
        fails. iContact's own Getting Started guide now directs testers to a
        free production account instead.
      detail: sandbox/icontact-sandbox.yml

operations_maturity:
  status_page: true
  incident_history: true
  changelog: false
  deprecation_policy: false
  sla: false
  machine_readable_spec: false
