  - https://help.icontact.com/customers/s/article/API-Getting-Started-Guide
name: iContact REST API lifecycle
api: icontact:rest-api

versioning:
  scheme: major.minor
  style: request-header negotiation
  header: API-Version
  supported_versions: ['2.0', '2.1', '2.2']
  current: '2.2'
  in_url: false
  unknown_version_behavior: 'HTTP 501 Not Implemented'
  version_gated_behavior:
    - operation: 'PUT /a/{accountId}/c/{clientFolderId}/subscriptions/{subscriptionId}'
      requires: '2.2'
      description: Move a contact to another list.
      source: https://help.icontact.com/customers/s/article/Subscriptions-iContact-API
  note: >-
    Three versions are simultaneously selectable via a header with no published
    sunset for 2.0 or 2.1, so an integration pinned to 2.0 has no signal that it
    should move.

changelog:
  published: false
  detail: changelog/icontact-changelog.yml
  note: >-
    The Advanced Users article lists "API Version Changelog" in its own table of
    contents, but the article body ends after "Coding Best Practices" and no
    changelog section is rendered. Verified 2026-08-13.

deprecation_policy:
  published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    No deprecation policy, no advance-notice window, and no RFC 8594
    Sunset/Deprecation response headers are documented anywhere in the
    developer reference. Retirements below were established by probe, not by a
    provider announcement.

sla:
