agent_safety_notes:
  - >-
    POST on a member is a partial update and PUT on a member is a destructive
    replace. An agent that assumes REST-standard PUT semantics will silently
    erase every field it does not send.
  - >-
    GET on contacts silently returns only 20 rows when limit is omitted, and
    only list-subscribed contacts unless status=total is passed. Both defaults
    will cause an agent to under-report.
  - >-
    The sends resource has no dry-run. There is no way to rehearse an email
    campaign against this API.
  - >-
    No idempotency key exists, so no write is safe to retry blindly.
