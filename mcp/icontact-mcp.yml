candidate_tools:
  note: >-
    Derived from the resources and methods iContact publishes in its own
    reference. Each tool names the exact documented HTTP method and URI it
    would wrap. Input schemas are NOT asserted: iContact publishes no
    OpenAPI, so parameter types would have to be inferred from prose field
    tables rather than read from a contract.
  base_path: '/a/{accountId}/c/{clientFolderId}'
  tools:
    - name: get_server_time
      rest: 'GET /icp/time'
      auth_required: false
      description: Return iContact server time (UTC) and UNIX epoch timestamp.
    - name: list_accounts
      rest: 'GET /icp/a/'
      description: List accounts available to the credential.
    - name: list_client_folders
      rest: 'GET /icp/a/{accountId}/c/'
      description: List client folders in an account.
    - name: get_client_folder
      rest: 'GET /a/{accountId}/c/{clientFolderId}'
    - name: list_contacts
      rest: 'GET /a/{accountId}/c/{clientFolderId}/contacts'
      description: >-
        Search contacts. Supports limit, offset, orderby, per-field filters,
        wildcard and comparison operators. Defaults to listed contacts only;
        pass status=total for all, status=unlisted for unsubscribed-to-nothing.
    - name: get_contact
      rest: 'GET /a/{accountId}/c/{clientFolderId}/contacts/{contactId}'
    - name: create_contacts
      rest: 'POST /a/{accountId}/c/{clientFolderId}/contacts'
      destructive: false
      warning: >-
        POST on the collection both creates AND updates. Omit contactId to
        create.
    - name: update_contact
      rest: 'POST /a/{accountId}/c/{clientFolderId}/contacts/{contactId}'
      description: Merge-update — only supplied fields change.
    - name: replace_contact
      rest: 'PUT /a/{accountId}/c/{clientFolderId}/contacts/{contactId}'
      destructive: true
      warning: Deletes all data and stores only the supplied data.
    - name: delete_contact
      rest: 'DELETE /a/{accountId}/c/{clientFolderId}/contacts/{contactId}'
      destructive: true
    - name: get_contact_history
      rest: 'GET /a/{accountId}/c/{clientFolderId}/contacts/{contactId}/actions'
    - name: list_lists
      rest: 'GET /a/{accountId}/c/{clientFolderId}/lists'
    - name: create_lists
      rest: 'POST /a/{accountId}/c/{clientFolderId}/lists'
    - name: delete_list
      rest: 'DELETE /a/{accountId}/c/{clientFolderId}/lists/{listId}'
      destructive: true
    - name: list_subscriptions
      rest: 'GET /a/{accountId}/c/{clientFolderId}/subscriptions'
    - name: subscribe_contact
      rest: 'POST /a/{accountId}/c/{clientFolderId}/subscriptions'
      description: Associate a contact with a list. Required to put a contact on a list.
    - name: move_subscription
      rest: 'PUT /a/{accountId}/c/{clientFolderId}/subscriptions/{subscriptionId}'
      requires_api_version: '2.2'
    - name: list_segments
      rest: 'GET /a/{accountId}/c/{clientFolderId}/segments'
    - name: create_segments
      rest: 'POST /a/{accountId}/c/{clientFolderId}/segments'
    - name: list_segment_criteria
      rest: 'GET /a/{accountId}/c/{clientFolderId}/segments/{segmentId}/criteria'
    - name: list_campaigns
      rest: 'GET /a/{accountId}/c/{clientFolderId}/campaigns'
    - name: create_campaigns
      rest: 'POST /a/{accountId}/c/{clientFolderId}/campaigns'
    - name: list_messages
      rest: 'GET /a/{accountId}/c/{clientFolderId}/messages'
    - name: create_messages
      rest: 'POST /a/{accountId}/c/{clientFolderId}/messages'
    - name: send_message
      rest: 'POST /a/{accountId}/c/{clientFolderId}/sends'
      destructive: true
      warning: >-
        Dispatches real email to real contacts. There is no sandbox, no
        dry-run and no idempotency key — a retry can double-send.
    - name: get_message_statistics
