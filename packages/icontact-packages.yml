summary: >-
  iContact publishes three first-party PHP client libraries on GitHub and
  nothing else. None of the three is published to Packagist or any other
  package registry, none carries a git tag or a GitHub release, and the most
  recently touched of them was last pushed in March 2018 — more than eight
  years ago. There is no first-party JavaScript, Python, Ruby, Java, Go, .NET
  or CLI client. Every registry-installable iContact client in existence is
  third-party.
