name: iContact REST API test environment
api: icontact:rest-api
sandbox_available: false
summary: >-
  iContact no longer offers a sandbox. Its own Getting Started guide, under a
  heading literally titled "Sandbox Account", instructs developers to create a
  free production account instead and warns that testing happens against live
  data.
provider_guidance:
  quote: >-
    "Sandbox Account: We recommend creating a new free production iContact
    account for testing your integrations and API calls. No credit card is
    required."
  production_warning: >-
    "You can create and test your iContact API Application using a trial, or
    full account with iContact. Be careful. All changes in contacts, messages,
    sends or any other resource will modify your live data."
  signup: https://www.icontact.com/signup/
  trial_days: 30
  credit_card_required: false
test_vs_live:
  separate_environments: false
  key_prefixes: false
  key_prefix_note: >-
    Credentials are an API-AppId plus a username and an application password;
    there is no test-mode/live-mode prefix or flag that lets a caller tell which
    environment a credential targets.
  mode_header: false
