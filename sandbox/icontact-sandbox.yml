test_fixtures:
  test_cards: null
  test_accounts: null
  time_simulation: false
  triggers: false
  note: >-
    Not applicable — iContact is an email marketing API, not a payments API.
    No fixture, seeding or trigger tooling is published.
dry_run:
  supported: false
  note: >-
    No dry-run, preview or validate-only mode is documented on any resource.
    Because the Sends resource dispatches real email to real contacts, an
    agent has no safe way to rehearse a send.
safe_read_only_probe:
  endpoint: GET https://app.icontact.com/icp/time
  auth_required: false
  probed: '2026-08-13'
  http_status: 200
  note: >-
    The only unauthenticated, side-effect-free endpoint on the API. Useful as a
    reachability and clock-skew check, and it is the closest thing to a health
    check iContact publishes.
risk:
  level: high
  detail: >-
    With no sandbox, no dry-run and no idempotency key, every integration test
    against iContact mutates production data, and a retried send cannot be
    deduplicated.
