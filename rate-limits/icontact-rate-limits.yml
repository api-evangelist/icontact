note: >-
  iContact confirms in its own developer documentation that rate limiting is
  enforced but publishes no limit, no window, no burst allowance, no exhaustion
  status code and no response header. The documented HTTP status code reference
  lists no 429. An integrator therefore cannot know a limit exists until they
  are throttled, and cannot detect throttling from a header at runtime. This is
  an honest zero: the limit is real, the number is unpublished.
