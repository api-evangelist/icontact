safety_summary:
  - >-
    POST on a member is a MERGE update; PUT on a member is a DESTRUCTIVE
    REPLACE that deletes every field not supplied. This inverts what an agent
    trained on REST convention will assume.
  - >-
    There is no sandbox, no dry-run and no idempotency key. Every call mutates
    production, and no write is safe to retry blindly.
  - >-
    GET /contacts silently caps at 20 rows and silently omits contacts not on
    a list.
  - >-
    Creating a send dispatches real email to real people and cannot be undone.
